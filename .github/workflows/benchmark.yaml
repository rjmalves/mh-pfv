name: Benchmark

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::bench, any::pkgload
          needs: check

      - name: Run benchmarks
        run: |
          results_dir <- file.path(getwd(), "benchmark-results")
          dir.create(results_dir)

          scripts <- list.files("inst/benchmarks", pattern = "\\.r$", full.names = TRUE)
          for (script in scripts) {
            cat(sprintf("\n=== Running %s ===\n", basename(script)))
            tryCatch(
              source(script, local = new.env(parent = globalenv())),
              error = function(e) cat("FAILED:", conditionMessage(e), "\n")
            )
          }
        shell: Rscript {0}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          retention-days: 30
